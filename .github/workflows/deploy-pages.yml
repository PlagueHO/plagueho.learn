name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Presentations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build all presentations
        run: |
          set -e
          shopt -s nullglob
          mkdir -p _site

          found=0
          for slides in presentations/*/slides.md; do
            deck=$(dirname "$slides")
            deck_name=$(basename "$deck")

            # Skip the template presentation
            if [ "$deck_name" = "template" ]; then
              echo "Skipping template presentation"
              continue
            fi

            echo "::group::Building $deck_name"
            pnpm exec slidev build "$slides" --base "/${{ github.event.repository.name }}/${deck_name}/" --out "../../_site/${deck_name}"
            echo "::endgroup::"
            found=$((found + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No presentations found to build."
            exit 1
          fi
          echo "Successfully built $found presentation(s)."

      - name: Generate index page
        run: |
          set -e
          node scripts/generate-pages-index.mjs _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

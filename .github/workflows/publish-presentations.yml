name: Publish Presentations

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  publish-presentations:
    name: Build and Publish Presentations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package Slidev presentations
        run: |
          set -e
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"
          found=0
          for slides in presentations/*/slides.md; do
            deck=$(dirname "$slides")
            deck_name=$(basename "$deck")
            if [ "$deck_name" = "template" ]; then
              echo "Skipping the Slidev starter template."
              continue
            fi
            if [ -f "$deck/package.json" ] && node --input-type=module - "$deck/package.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          process.exit(Object.hasOwn(pkg.dependencies ?? {}, 'reveal.js') ||
            Object.hasOwn(pkg.devDependencies ?? {}, 'reveal.js') ? 0 : 1);
          NODE
            then
              echo "Skipping $deck_name because it uses Reveal.js."
              continue
            fi
            echo "::group::Building $deck_name"
            pnpm exec slidev build "$slides" --out dist
            echo "::endgroup::"
            cp scripts/serve-presentation.mjs "$deck/dist/serve.mjs"
            (
              cd "$deck/dist"
              zip -r "${GITHUB_WORKSPACE}/${deck_name}-${tag}.zip" .
            )
            echo "Packaged ${deck_name}-${tag}.zip"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No presentations found to build."
            exit 1
          else
            echo "Successfully built and packaged $found presentation(s)."
          fi

      - name: Test offline presentation server
        run: node --test scripts/serve-presentation.test.mjs

      - name: Build and package Reveal.js presentations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          repository="${GITHUB_REPOSITORY##*/}"
          tag="${GITHUB_REF_NAME}"
          found=0
          for manifest in presentations/*/package.json; do
            is_reveal=$(node --input-type=module - "$manifest" <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = process.argv[2];
          const pkg = JSON.parse(readFileSync(manifest, 'utf8'));
          console.log(Object.hasOwn(pkg.dependencies ?? {}, 'reveal.js') ||
            Object.hasOwn(pkg.devDependencies ?? {}, 'reveal.js'));
          NODE
            )
            if [ "$is_reveal" != "true" ]; then
              continue
            fi
            deck=$(dirname "$manifest")
            deck_name=$(basename "$deck")
            for component in "$repository" "$deck_name" "$tag"; do
              if [[ ! "$component" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
                echo "::error::Unsafe release asset name. Use letters, digits, dots, underscores, or hyphens."
                exit 1
              fi
            done
            echo "::group::Building Reveal.js presentation $deck_name"
            (
              cd "$deck"
              npm ci
              npm run build
              npm test
              if [ ! -f dist/index.html ]; then
                echo "::error::Reveal.js build did not produce dist/index.html."
                exit 1
              fi
              cp "${GITHUB_WORKSPACE}/scripts/serve-presentation.mjs" dist/serve.mjs
              cd dist
              zip -r "${GITHUB_WORKSPACE}/${repository}-${deck_name}-${tag}.zip" .
            )
            echo "::endgroup::"
            echo "Packaged ${repository}-${deck_name}-${tag}.zip"
            found=$((found + 1))
          done
          echo "Successfully built and packaged $found Reveal.js presentation(s)."

      - name: Create GitHub release with presentation assets
        uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          fail_on_unmatched_files: true
